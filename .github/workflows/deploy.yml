name: Build and deploy

on:
    push:
        branches: [master]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v2

            - name: Prepare environment
              uses: actions/setup-node@v2
              with:
                  node-version: "25"

            - run: npm install --global sass

            - name: Build theme
              run: sass hazels-theme.theme.scss .dist/hazels-theme.theme.css

            - name: Copy manifests
              run: |
                  cp cumcord_theme.json .dist

              # remove everything except `.dist`, then move stuff back into root.
            - name: Commit changes
              run: |
                  for item in *
                  do
                    if [ $item != ".dist" ]; then
                      rm -rf $item
                    fi
                  done
                  rm .gitignore
                  rm -rf .github

                  mv .dist/* .
                  rmdir .dist

                  git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git add .
                  git commit -am "[CI CHORE] Build update"

            - name: Push to dist branch
              uses: ad-m/github-push-action@master
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  branch: "dist"
                  force: true
